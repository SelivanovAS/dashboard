# Тюмень: отдельный вход к существующему Worker через VPS.
# Query с ключом доступа не включается в журнал запросов.
log_format cm_tyumen '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name api2-tyumen.delosud.ru;
    access_log /var/log/nginx/api2-tyumen.access.log cm_tyumen;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-tyumen;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api2-tyumen.delosud.ru;
    client_max_body_size 10m;
    access_log /var/log/nginx/api2-tyumen.access.log cm_tyumen;
    error_log /var/log/nginx/api2-tyumen.error.log crit;

    ssl_certificate /etc/letsencrypt/live/api2-tyumen.delosud.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api2-tyumen.delosud.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /admin/import-dump {
        access_log off;
        # Обычные upstream-ошибки nginx включают query с ключом роли.
        error_log /var/log/nginx/api2-tyumen-upload.error.log crit;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_request_buffering on;
    }

    location ^~ /_gateway-upload/ {
        access_log off;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_vary on;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    location / {
        resolver 127.0.0.53 valid=300s ipv6=off;
        set $up https://api-tyumen.delosud.ru;
        proxy_pass $up;
        proxy_set_header Host api-tyumen.delosud.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name api-tyumen.delosud.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
