# Включать только в HTTPS server api2-ural.delosud.ru.
    location = /admin/import-dump {
        access_log off;
        # Обычные upstream-ошибки nginx включают query с ключом роли.
        error_log /var/log/nginx/api2-ural-upload.error.log crit;
        proxy_pass http://127.0.0.1:8785;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_request_buffering on;
    }

    location ^~ /_gateway-upload/ {
        access_log off;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_vary on;
        proxy_pass http://127.0.0.1:8785;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering on;
    }
