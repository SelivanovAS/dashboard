# Башкортостан: отдельный вход к существующему Worker через VPS.
# Query с ключом доступа не включается в журнал запросов.
log_format cm_bashkortostan '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name api2-bashkortostan.delosud.ru;
    access_log /var/log/nginx/api2-bashkortostan.access.log cm_bashkortostan;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt-bashkortostan;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api2-bashkortostan.delosud.ru;
    client_max_body_size 10m;
    access_log /var/log/nginx/api2-bashkortostan.access.log cm_bashkortostan;

    ssl_certificate /etc/letsencrypt/live/api2-bashkortostan.delosud.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api2-bashkortostan.delosud.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        resolver 127.0.0.53 valid=300s ipv6=off;
        set $up https://api-bashkortostan.delosud.ru;
        proxy_pass $up;
        proxy_set_header Host api-bashkortostan.delosud.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name api-bashkortostan.delosud.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
