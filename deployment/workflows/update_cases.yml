# Имя файла (update_cases.yml) не менять: Cloudflare Worker дёргает
# workflow_dispatch по нему (cloudflare-worker/worker.js, scheduled).
name: "📊 Основной прогон: парсинг + дайджест"

on:
  # Автозапуск (с 05.07.2026 возвращён в облако): Cloudflare Worker по крону
  # дёргает этот workflow через workflow_dispatch (crons в cloudflare-worker/
  # wrangler.toml, 03:30 UTC = 08:30 ХМАО, пн-пт). Суды снова пускают US-IP
  # GitHub (проверено probe_courts.yml), поэтому полный прогон идёт в облаке.
  workflow_dispatch:  # Запуск через Cloudflare Worker (cron) или вручную из UI
    inputs:
      to_group:
        description: 'Отправить дайджест в корпоративную группу (TELEGRAM_CHAT_ID). В личный чат всегда направляется технический отчёт.'
        required: false
        type: boolean
        default: false
      smart_skip:
        description: 'Smart-skip: пропускать дела с известной будущей датой (заседание/без движения) и нерабочие дни РФ. Cron всегда true; ручной запуск — false для полного прогона.'
        required: false
        type: boolean
        default: false
      ignore_calendar:
        description: 'Прогнать даже в выходной/праздник: режим ежедневного крона (smart-skip по делам сохраняется), но без проверки производственного календаря. Без этой галки прогон со smart_skip в нерабочий день завершается сразу.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  deployments: read   # читать статус github-pages деплоя (страховка публикации)

# Сериализация записи в data/ с импортом дампов (import_cases.yml): у прогона
# push без rebase — параллельный импорт уронил бы его non-fast-forward'ом,
# а rebase прогона затёр бы только что импортированные дела.
concurrency:
  group: cases-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_DIGEST_MODE: technical
      DEFER_TECHNICAL_REPORT: "1"
    # Страховка от молчаливого зависания: обычный прогон — 10-25 мин, с полным
    # пулом исков банка — до ~1 ч; 2 часа хватает даже при массовых ретраях
    # sudrf, а дефолтные 6 ч только оттягивали бы 🚨-алерт (шаг failure() при
    # отсечке по таймауту не срабатывает — job отменяется, а не падает).
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Начать технический отчёт
        run: |
          report_path="$RUNNER_TEMP/court-technical-report.json"
          rm -f -- "$report_path" "${report_path%.json}.html"
          echo "TECHNICAL_REPORT_PATH=$report_path" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run court monitor
        id: digest
        env:
          # Регион территории (Actions Variable форка; пусто у эталона = hmao).
          # Форк задаёт REGION и DASHBOARD_URL в Settings → Variables — код
          # общий для всех территорий.
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # Трек «Иски банка»: BANK_TRACK=0 в Variables выключает его для
          # территории. Фолбэк '1' = сегодняшнее поведение, поэтому у эталона
          # и территорий без переменной ничего не меняется.
          # ⚠ Гасит только ПРОГОН. Сегмент «🏦 Иски банка» на дашборде прячется
          # по отсутствию data/cases_bank.json (HEAD-проба probeBankFile), про
          # флаг фронт не знает — файл территории всё равно надо удалять.
          # Ручные import_bank_registry/collect_bank_claims флаг тоже не
          # спрашивают и файл создадут: это их работа, запускают их осознанно.
          BANK_TRACK: ${{ vars.BANK_TRACK || '1' }}
          # Авто-подхват исков банка со страницы выдачи (блок 3b фазы 3).
          # BANK_AUTO_INTAKE=0 оставляет трек работать, но новые иски снова
          # заводятся только вручную. BANK_INTAKE_DRY_RUN=1 — холостой прогон:
          # кандидаты считаются и логируются, карточки не качаются, записи не
          # создаются (для первого прогона после деплоя).
          BANK_AUTO_INTAKE: ${{ vars.BANK_AUTO_INTAKE || '1' }}
          BANK_INTAKE_DRY_RUN: ${{ vars.BANK_INTAKE_DRY_RUN || '0' }}
          # Кэпы подхвата — рычаг темпа ввода территории без правки кода
          # (разгон Урала 08.2026: юрист держит ~200 дел/день). Порог алерта
          # поднимают вместе с кэпом, иначе штатный разгон ежедневно алертит.
          BANK_INTAKE_MAX_PER_RUN: ${{ vars.BANK_INTAKE_MAX_PER_RUN || '30' }}
          BANK_INTAKE_MAX_CARDS_PER_COURT: ${{ vars.BANK_INTAKE_MAX_CARDS_PER_COURT || '10' }}
          BANK_INTAKE_ALERT_ADDED: ${{ vars.BANK_INTAKE_ALERT_ADDED || '50' }}
          # Порог свёртки «заведено N новых исков банка» в дайджесте.
          BANK_INTAKE_DIGEST_FOLD: ${{ vars.BANK_INTAKE_DIGEST_FOLD || '25' }}
          # Свёртка «вступило в силу» и потолок перечня сторон (21.08.2026):
          # replay обязан воспроизводить крон, иначе тестовый дайджест
          # разойдётся с боевым.
          BANK_FORCE_DIGEST_FOLD: ${{ vars.BANK_FORCE_DIGEST_FOLD || '3' }}
          # Шаг эскалации напоминания «ИЛ не выдан» (30/60/90/120/150).
          # Только здесь: календарный проход живёт в main_json, replay
          # рендерит уже собранный контекст и событий не эмитит.
          BANK_WRIT_OVERDUE_REPEAT_DAYS: ${{ vars.BANK_WRIT_OVERDUE_REPEAT_DAYS || '30' }}
          DIGEST_PARTIES_MAX_LEN: ${{ vars.DIGEST_PARTIES_MAX_LEN || '60' }}
          DIGEST_PARTIES_KEEP: ${{ vars.DIGEST_PARTIES_KEEP || '2' }}
          # Гибрид — дефолт кода (с 03.07.2026): программный рендер + LLM
          # только на пересказ мотивировок актов. Откат на полный
          # LLM-дайджест — вернуть строку `DIGEST_FULL_LLM: "1"`.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LLM боевого дайджеста: с 16.07.2026 дефолт — OpenRouter
          # Пересказы: фиксированный Apodex → настроенный GigaChat → Claude.
          # Вернуть Claude БЕЗ правки кода: Actions Variable
          # LLM_PROVIDER=claude (Settings → Variables; так же может
          # отличаться территория). При отсутствии ключа основного
          # провайдера используется следующий настроенный резерв.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SUMMARY_MODEL: apodex/apodex-1.1-mini:free
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_SCOPE: ${{ vars.GIGACHAT_SCOPE || 'GIGACHAT_API_PERS' }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-3-Pro' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5-20251001' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Группа получает дайджест по галке; личный чат — итоговый техотчёт.
          TELEGRAM_CHAT_ID: ${{ inputs.to_group && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_TEST }}
          TELEGRAM_DIGEST_MODE: ${{ inputs.to_group && 'digest' || 'technical' }}
          TELEGRAM_CHAT_ID_PERSONAL: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          # Web Push PWA-уведомления (опционально — если не заданы, пропускаются).
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Smart-skip: при автозапуске Worker передаёт smart_skip=true →
          # парсер пропускает нерабочие дни и дела с известной будущей датой.
          SKIP_NON_WORKING_DAYS: ${{ inputs.smart_skip && '1' || '' }}
          # Календарный гейт отдельно от пер-кейсового smart-skip: галка
          # ignore_calendar даёт «режим крона» в выходной (проверка правок,
          # добор после простоя суда). Крон её не передаёт — плановые прогоны
          # в праздники по-прежнему завершаются сразу.
          IGNORE_NON_WORKING_DAY: ${{ inputs.ignore_calendar && '1' || '' }}
          # Группы фаз (::group::) и аннотации WARNING/ERROR в UI Actions
          # (court_monitor/ghlog.py). Явный флаг, а не GITHUB_ACTIONS:
          # pytest-прогоны tests.yml не должны плодить аннотации.
          LOG_GH_ANNOTATIONS: "1"
          # Живой лог прогона в админке Worker (блок «Прогон (GitHub Actions)»):
          # pass-through-пушер шлёт строки stdout батчами на POST /run-progress.
          # Без секретов пушер работает как cat — прогон не страдает (но с
          # 16.07.2026 объявляет о сбое/выключении одной строкой в логе).
          # Токен: PUSH_SECRET первым — им же ходит пуш-доставка этого же шага,
          # поэтому он проверяемо совпадает с Worker'ом; PROGRESS_SECRET — лишь
          # запасной. (Причиной мёртвого канала 13–16.07.2026 были не секреты,
          # а Cloudflare-бан UA Python-urllib — см. USER_AGENT в пушере.)
          PROGRESS_URL: ${{ secrets.PUSH_WORKER_URL }}/run-progress
          PROGRESS_TOKEN: ${{ secrets.PUSH_SECRET || secrets.PROGRESS_SECRET }}
          # Логи и так флашатся построчно (StreamHandler/ghlog); это страховка
          # для «голых» print из зависимостей под pipe-буферизацией.
          PYTHONUNBUFFERED: "1"
          # Полный многосудовый обход: открытый хост остывает по времени,
          # пока очередь продолжает другие суды. FETCH_MAX_RETRIES не растёт.
          CARD_BREAKER_MODE: "time"
        run: |
          if [ "${{ inputs.to_group }}" = "true" ]; then
            echo "📢 GROUP CHAT: digest will go to corporate group"
          else
            echo "📱 Личный чат: технический отчёт после проверки публикации"
          fi
          if [ "${{ inputs.smart_skip }}" = "true" ]; then
            echo "🧠 SMART-SKIP: skip-нерабочих-дней + skip-будущих-заседаний"
          fi
          if [ "${{ inputs.ignore_calendar }}" = "true" ]; then
            echo "📆 IGNORE-CALENDAR: прогон идёт и в нерабочий день (skip по делам сохранён)"
          fi
          # pipefail обязателен: дефолтный shell GitHub (bash -e) его НЕ
          # включает — без него пушер маскировал бы падение парсера, и
          # failure-алерт ниже ослеп бы.
          set -o pipefail
          python scripts/update_cases.py --json 2>&1 | python -u scripts/gh_progress_pusher.py

      - name: Commit updated data
        id: commit
        run: |
          echo "status=failed" >> "$GITHUB_OUTPUT"
          git config user.name "Court Monitor Bot"
          git config user.email "bot@court-monitor.local"
          # Список коммитимых файлов ОДИН на облако и Mac-резерв: хелпер
          # спрашивает пути у court_monitor.config (там они и объявлены).
          # Раньше список вёлся руками в двух местах и молча разъехался —
          # Mac-путь не коммитил семь файлов трека «Иски банка», появившихся
          # уже после того, как резерв усыпили. См. ops/stage_data_files.sh.
          bash ops/stage_data_files.sh
          BEFORE_SHA=$(git rev-parse HEAD)
          git diff --cached --quiet || git commit -m "📊 Обновление данных $(date +'%d.%m.%Y %H:%M')"
          AFTER_SHA=$(git rev-parse HEAD)
          git push
          echo "status=confirmed" >> "$GITHUB_OUTPUT"
          # Запомним, создан ли новый коммит: по нему проверяем публикацию Pages
          # (нет коммита → нет нового деплоя → проверять нечего).
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # Страховка публикации сайта. GitHub Pages (Deploy from a branch → Jekyll)
      # иногда плавающе роняет сборку: если деплой для только что запушенного
      # коммита упал, сайт «замерзает» на прошлой версии — данные на сайте не
      # обновляются, хотя сам прогон зелёный (инцидент 06.07.2026, см. фикс
      # .nojekyll). Результат деплоя и сверку свежих байтов включаем в отчёт.
      - name: Проверка публикации GitHub Pages
        id: pages
        if: success() && steps.commit.outputs.status == 'confirmed'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/last_digest.json"
        run: |
          echo "status=failed" >> "$GITHUB_OUTPUT"
          WANT=$(sha256sum data/last_digest.json | cut -d' ' -f1)
          SHA="${{ steps.commit.outputs.sha }}"
          echo "Проверяем свежий дайджест на GitHub Pages…"
          STATE=""
          # ~4 мин с запасом: обычно деплой Pages завершается меньше чем за минуту.
          for i in $(seq 1 24); do
            GOT=$(curl -fsSL "${PAGES_URL}?pubcheck=$(date +%s)-${i}" | sha256sum | cut -d' ' -f1 || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "✅ Pages отдаёт свежий дайджест"
              echo "status=confirmed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DID=""
            if [ -n "$SHA" ]; then
              DID=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&sha=${SHA}&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)
            fi
            if [ -n "$DID" ]; then
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${DID}/statuses?per_page=1" --jq '.[0].state // empty' 2>/dev/null || true)
              echo "[$i] deployment ${DID} → ${STATE:-<нет статуса>}"
              case "$STATE" in
                failure|error) break ;;
              esac
            else
              echo "[$i] github-pages деплой ещё не создан…"
            fi
            sleep 10
          done
          if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
            echo "::warning::Публикация Pages завершилась ошибкой"
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Свежий дайджест на Pages не подтверждён за отведённое время (${STATE:-нет данных})"
            echo "status=unconfirmed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # CLI отчёта использует стандартную библиотеку и работает при сбое pip.
      - name: Технический отчёт в личный Telegram
        if: always()
        env:
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PERSONAL: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          WORKFLOW_STATUS: ${{ job.status }}
          DIGEST_STATUS: ${{ steps.digest.outcome || 'unknown' }}
          PUBLICATION_STATUS: ${{ steps.commit.outputs.status || 'skipped' }}
          PAGES_STATUS: ${{ steps.pages.outputs.status || 'skipped' }}
        run: |
          report_python="$(command -v python || command -v python3)"
          if [ -f scripts/technical_report.py ]; then
            "$report_python" scripts/technical_report.py --send \
            --workflow-status "$WORKFLOW_STATUS" \
            --digest-step "$DIGEST_STATUS" \
            --data-publication "$PUBLICATION_STATUS" \
            --pages "$PAGES_STATUS" \
            --push-step unknown
          else
            # Checkout мог завершиться до появления CLI. Этот запасной сигнал
            # не зависит от файлов проекта и никогда не дублирует вызов CLI.
            "$report_python" - <<'PY_FALLBACK'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('TELEGRAM_CHAT_ID_PERSONAL') or os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat:
              print('Аварийный технический отчёт: Telegram не настроен.')
              sys.exit(1)
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          message = ('🚨 Технический отчёт не собран: после checkout недоступны файлы проекта. '
                     'Результат парсинга и доставки не подтверждён. '
                     f'Проверьте запуск: https://github.com/{repository}/actions/runs/{run_id}')
          payload = json.dumps({'chat_id': chat, 'text': message, 'disable_web_page_preview': True}).encode()
          try:
              request = Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload,
                                headers={'Content-Type': 'application/json'})
              with urlopen(request, timeout=30) as response:
                  accepted = bool(json.load(response).get('ok'))
          except Exception:
              accepted = False
          print('Аварийный технический отчёт принят Telegram.' if accepted
                else 'Telegram не подтвердил аварийный технический отчёт.')
          sys.exit(0 if accepted else 1)
          PY_FALLBACK
          fi

      - name: Сохранить технический отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/court-technical-report.json
            ${{ runner.temp }}/court-technical-report.html
          if-no-files-found: ignore
          retention-days: 7
