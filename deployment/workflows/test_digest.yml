name: 🧪 Тест дайджеста (replay)

# Объединённый тестовый прогон. Парсинга не делает — переигрывает
# последний продовый дайджест из data/last_digest_context.json (гибрид:
# программный шаблон + LLM на пересказ мотивировок; галка full_llm —
# откат на старый полный LLM-вариант). LLM-провайдер выбирается списком
# llm_provider (claude / gigachat / openrouter); модель — выпадающим списком
# своего провайдера: gigachat_model (имена моделей GigaChat) или
# openrouter_model (место в рейтинге бесплатных моделей shir-man.com —
# конкретный id резолвится на прогоне, чтобы список не протухал).
# Текстовое поле llm_model перебивает оба списка (произвольный id).
# Telegram: личный технический отчёт всегда, дайджест в группу по галке.
# Публикация результатов (last_digest.json, cases.json, кэш пересказов) —
# только по галке commit_results: без неё тестовый дайджест НЕ попадает на
# дашборд, и PWA push тоже не отправляется (пуш ведёт на дашборд — без
# публикации он показал бы старый дайджест). push_all регулирует круг
# получателей пуша при включённой публикации.
# Имена inputs (commit_results и др.) — латиницей: GitHub не допускает
# кириллицу в идентификаторах; русский текст — в description (его и видно
# в форме Run workflow).

on:
  workflow_dispatch:
    inputs:
      to_group:
        description: 'Слать дайджест в корпоративную группу Telegram. В личный чат всегда направляется технический отчёт.'
        required: false
        type: boolean
        default: false
      push_all:
        description: 'PWA push на ВСЕ устройства (включая коллег). Снять галку — только владельцу. Работает только вместе с галкой «опубликовать».'
        required: false
        type: boolean
        default: false
      full_llm:
        description: 'Старый вариант (DIGEST_FULL_LLM=1) — полный LLM-вызов с большим контекстом вместо программного шаблона.'
        required: false
        type: boolean
        default: false
      llm_provider:
        description: 'LLM-провайдер дайджеста.'
        required: false
        type: choice
        options:
          - claude
          - gigachat
          - openrouter
        default: claude
      claude_model:
        description: 'Модель Claude (действует при провайдере claude). haiku — боевой эталон; sonnet/opus дороже, для сравнения.'
        required: false
        type: choice
        options:
          - haiku
          - sonnet
          - opus
        default: haiku
      claude_effort:
        description: 'Уровень усилий Claude (только sonnet/opus — haiku не поддерживает, значение игнорируется). default = не отправлять, у API это high.'
        required: false
        type: choice
        options:
          - default
          - low
          - medium
          - high
          - xhigh
          - max
        default: default
      gigachat_model:
        description: 'Модель GigaChat (действует при провайдере gigachat).'
        required: false
        type: choice
        options:
          - GigaChat-3-Pro
          - GigaChat-2-Pro
          - GigaChat-2
          - GigaChat-2-Max
          - GigaChat-3-Ultra
        default: GigaChat-3-Pro
      openrouter_model:
        description: 'Модель OpenRouter (при провайдере openrouter) — место в рейтинге бесплатных моделей shir-man.com; конкретная модель подставляется на прогоне из свежего рейтинга и указывается в техническом отчёте и логе.'
        required: false
        type: choice
        options:
          - модель дня (топ-1)
          - топ-2
          - топ-3
          - топ-4
          - топ-5
        default: модель дня (топ-1)
      llm_model:
        description: 'Другая модель (текстом) — перебивает все списки. Например, свежая free-модель OpenRouter, которой нет в рейтинге, GigaChat-Max или точный id Claude.'
        required: false
        type: string
        default: ''
      commit_results:
        description: 'Опубликовать результаты: дайджест попадёт на дашборд (last_digest.json, cases.json, кэш пересказов) и уйдёт PWA push. Без галки — личный техотчёт и дайджест в группу, если она выбрана.'
        required: false
        type: boolean
        default: false

# Коммит обновлённого last_digest.json — нужен contents: write.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_DIGEST_MODE: technical
      DEFER_TECHNICAL_REPORT: "1"

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v5

      - name: Начать технический отчёт
        run: |
          report_path="$RUNNER_TEMP/court-technical-report.json"
          rm -f -- "$report_path" "${report_path%.json}.html"
          echo "TECHNICAL_REPORT_PATH=$report_path" >> "$GITHUB_ENV"

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install -r scripts/requirements.txt

      - name: Переигровка последнего дайджеста
        id: digest
        env:
          # Регион территории (Actions Variable форка; пусто у эталона = hmao).
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # Порог свёртки «заведено N новых исков банка»: replay обязан
          # воспроизводить крон, иначе тестовый дайджест разойдётся с боевым.
          BANK_INTAKE_DIGEST_FOLD: ${{ vars.BANK_INTAKE_DIGEST_FOLD || '25' }}
          # Свёртка «вступило в силу» и потолок перечня сторон (21.08.2026):
          # replay обязан воспроизводить крон, иначе тестовый дайджест
          # разойдётся с боевым.
          BANK_FORCE_DIGEST_FOLD: ${{ vars.BANK_FORCE_DIGEST_FOLD || '3' }}
          DIGEST_PARTIES_MAX_LEN: ${{ vars.DIGEST_PARTIES_MAX_LEN || '60' }}
          DIGEST_PARTIES_KEEP: ${{ vars.DIGEST_PARTIES_KEEP || '2' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.to_group && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_TEST }}
          TELEGRAM_DIGEST_MODE: ${{ inputs.to_group && 'digest' || 'technical' }}
          TELEGRAM_CHAT_ID_PERSONAL: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          # PWA push уходит только вместе с публикацией: без commit_results
          # PUSH-переменные пустые, и send_web_push тихо пропускает отправку
          # («Web Push: переменные не настроены, пропуск»).
          PUSH_WORKER_URL: ${{ inputs.commit_results && secrets.PUSH_WORKER_URL || '' }}
          PUSH_SECRET: ${{ inputs.commit_results && secrets.PUSH_SECRET || '' }}
          VAPID_PRIVATE_KEY: ${{ inputs.commit_results && secrets.VAPID_PRIVATE_KEY || '' }}
          # Управление архитектурой дайджеста для тестирования:
          # без галки — боевой гибрид, с галкой — старый полный LLM.
          DIGEST_FULL_LLM: ${{ inputs.full_llm && '1' || '' }}
          # Выбор LLM-провайдера и модели. Модель берётся из выпадающего
          # списка своего провайдера; текстовое поле llm_model (если
          # заполнено) перебивает оба списка. Читает переменную только
          # активный провайдер. «Топ-N» в OPENROUTER_MODEL резолвится в
          # конкретную модель на прогоне (llm._resolve_openrouter_model).
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          # Модель Claude: короткое имя из списка (haiku/sonnet/opus) или точный
          # id из llm_model; config.py резолвит алиасы и держит haiku дефолтом.
          CLAUDE_MODEL: ${{ inputs.llm_model || inputs.claude_model }}
          # Уровень усилий (output_config.effort) для sonnet/opus; «default»
          # config.py резолвит в пусто = параметр не отправляется (API: high).
          CLAUDE_EFFORT: ${{ inputs.claude_effort }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_SCOPE: GIGACHAT_API_PERS
          GIGACHAT_MODEL: ${{ inputs.llm_model || inputs.gigachat_model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.llm_model || inputs.openrouter_model }}
          OPENROUTER_SUMMARY_MODEL: __selected__
          # Группы фаз и аннотации WARNING/ERROR в UI Actions (ghlog.py).
          LOG_GH_ANNOTATIONS: "1"
        run: |
          if [ -n "${{ inputs.llm_model }}" ]; then
            echo "🧠 Провайдер: ${{ inputs.llm_provider }}, модель (текстом): ${{ inputs.llm_model }}"
          elif [ "${{ inputs.llm_provider }}" = "gigachat" ]; then
            echo "🧠 Провайдер: gigachat, модель: ${{ inputs.gigachat_model }}"
          elif [ "${{ inputs.llm_provider }}" = "openrouter" ]; then
            echo "🧠 Провайдер: openrouter, модель: ${{ inputs.openrouter_model }} — конкретный id см. ниже в логе"
          else
            echo "🧠 Провайдер: claude, модель: ${{ inputs.claude_model }}, усилия: ${{ inputs.claude_effort }}"
          fi
          if [ "${{ inputs.to_group }}" = "true" ]; then
            echo "📢 Дайджест уйдёт в корпоративную группу Telegram"
          else
            echo "📱 В личный чат уйдёт технический отчёт после всех этапов"
          fi
          if [ "${{ inputs.full_llm }}" = "true" ]; then
            echo "🤖 Полный LLM-вызов (DIGEST_FULL_LLM=1) вместо гибрида"
          else
            echo "🏗 Гибрид: программный шаблон + LLM-пересказы актов"
          fi
          if [ "${{ inputs.commit_results }}" != "true" ]; then
            echo "🔕 Без публикации на дашборд — PWA push пропускается"
            python scripts/update_cases.py --replay-last
          elif [ "${{ inputs.push_all }}" = "true" ]; then
            echo "📣 PWA push на все устройства (включая коллег)"
            python scripts/update_cases.py --replay-last --push-all
          else
            echo "👤 PWA push только устройствам владельца"
            python scripts/update_cases.py --replay-last
          fi

      - name: Публикация результатов на дашборд
        id: commit
        # Без галки commit_results результаты теста живут только в логе
        # прогона и в Telegram — сайт (GitHub Pages) не меняется.
        if: ${{ inputs.commit_results }}
        run: |
          echo "status=failed" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/last_digest.json ]; then
            git add data/last_digest.json
          fi
          # Журнал последней push-рассылки — читает админка подписчиков. Тестовые
          # прогоны тоже шлют push (владельцу/всем), и этот файл должен попадать
          # на GitHub Pages, иначе админка не покажет, что получила подписка.
          if [ -f data/last_personal_pushes.json ]; then
            git add data/last_personal_pushes.json
          fi
          # cases.json (act_analysis из replay) + кэш LLM-пересказов —
          # та же пара, что коммитит replay_on_push.yml.
          if [ -f data/cases.json ]; then
            git add data/cases.json
          fi
          if [ -f data/.act_summaries.json ]; then
            git add data/.act_summaries.json
          fi
          if [ -f data/.act_summaries.pending.json ]; then
            git add data/.act_summaries.pending.json
          fi
          if [ -f data/.llm_provider_state.json ]; then
            git add data/.llm_provider_state.json
          fi
          for archive in data/cases_bank.json data/cases_bank_events.json data/cases_archive.json data/cases_bank_archive.json data/cases_bank_archive_events.json data/cases_archive_[0-9][0-9][0-9][0-9].json data/cases_bank_archive_[0-9][0-9][0-9][0-9].json; do
            [ ! -f "$archive" ] || git add "$archive"
          done
          if git diff --cached --quiet; then
            echo "Нет изменений — нечего коммитить"
            echo "status=confirmed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "🔁 Тест дайджеста: результаты опубликованы на дашборд"
          git pull --rebase origin main || {
            echo "⚠ rebase не удался — публикация не подтверждена"
            echo "status=not_confirmed" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git push
          echo "status=confirmed" >> "$GITHUB_OUTPUT"

      - name: Проверка публикации дайджеста на Pages
        id: pages
        if: success() && steps.commit.outputs.status == 'confirmed'
        env:
          PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/last_digest.json"
        run: |
          echo "status=failed" >> "$GITHUB_OUTPUT"
          WANT=$(sha256sum data/last_digest.json | cut -d' ' -f1)
          for i in $(seq 1 40); do
            GOT=$(curl -fsSL "${PAGES_URL}?pubcheck=$(date +%s)-${i}" | sha256sum | cut -d' ' -f1 || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "Сайт отдаёт свежий дайджест (попытка ${i})"
              echo "status=confirmed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Pages не показал свежий дайджест за ~7 минут"
          echo "status=unconfirmed" >> "$GITHUB_OUTPUT"

      - name: Технический отчёт в личный Telegram
        if: always()
        env:
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PERSONAL: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          WORKFLOW_STATUS: ${{ job.status }}
          DIGEST_STATUS: ${{ steps.digest.outcome || 'unknown' }}
          PUBLICATION_STATUS: ${{ steps.commit.outputs.status || 'skipped' }}
          PAGES_STATUS: ${{ steps.pages.outputs.status || 'skipped' }}
          PUSH_STATUS: ${{ inputs.commit_results && 'unknown' || 'skipped' }}
        run: |
          report_python="$(command -v python || command -v python3)"
          if [ -f scripts/technical_report.py ]; then
            "$report_python" scripts/technical_report.py --send \
            --workflow-status "$WORKFLOW_STATUS" \
            --digest-step "$DIGEST_STATUS" \
            --data-publication "$PUBLICATION_STATUS" \
            --pages "$PAGES_STATUS" \
            --push-step "$PUSH_STATUS"
          else
            # Checkout мог завершиться до появления CLI. Этот запасной сигнал
            # не зависит от файлов проекта и никогда не дублирует вызов CLI.
            "$report_python" - <<'PY_FALLBACK'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('TELEGRAM_CHAT_ID_PERSONAL') or os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat:
              print('Аварийный технический отчёт: Telegram не настроен.')
              sys.exit(1)
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          message = ('🚨 Технический отчёт не собран: после checkout недоступны файлы проекта. '
                     'Результат парсинга и доставки не подтверждён. '
                     f'Проверьте запуск: https://github.com/{repository}/actions/runs/{run_id}')
          payload = json.dumps({'chat_id': chat, 'text': message, 'disable_web_page_preview': True}).encode()
          try:
              request = Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload,
                                headers={'Content-Type': 'application/json'})
              with urlopen(request, timeout=30) as response:
                  accepted = bool(json.load(response).get('ok'))
          except Exception:
              accepted = False
          print('Аварийный технический отчёт принят Telegram.' if accepted
                else 'Telegram не подтвердил аварийный технический отчёт.')
          sys.exit(0 if accepted else 1)
          PY_FALLBACK
          fi

      - name: Сохранить технический отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/court-technical-report.json
            ${{ runner.temp }}/court-technical-report.html
          if-no-files-found: ignore
          retention-days: 7
