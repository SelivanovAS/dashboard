name: "🔁 Резерв D2: дайджест на push"

# Вторая половина автозапуска (вариант D2). Парсинг судов делает Mac юриста
# (ops/mac-local-run/) и пушит свежий data/last_digest_context.json. Этот
# workflow ловит такой push и собирает НАСТОЯЩИЙ дайджест: Claude доступен из
# GitHub (США), а из РФ — нет, поэтому дайджест живёт здесь, а не на Mac.
#
# Эквивалент прежнего кроного update_cases.yml, но без парсинга: переигрывает
# сохранённый контекст (--replay-last) и рассылает всем (--push-all).

on:
  push:
    branches: [main]
    paths:
      - 'data/last_digest_context.json'

# Коммит перерисованного last_digest.json — нужен contents: write.
permissions:
  contents: write

# Не наслаивать прогоны, если пуши придут кучно.
concurrency:
  group: replay-on-push
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_DIGEST_MODE: technical
      DEFER_TECHNICAL_REPORT: "1"
    # ⏸ 05.07.2026 резерв усыпили (`if: false`), 16.08.2026 РАЗБУДИЛИ обратно:
    # проба показала 0 карточек из 21 с раннера GitHub — блок по адресу
    # вернулся, и Mac-парсинг снова на столе. Пока облачный крон жив, это
    # условие безвредно: крон пушит через GITHUB_TOKEN под актором
    # `github-actions[bot]`, и оно его отсекает — дайджест соберётся только на
    # push с Mac. Само переключение — отдельное действие: `crons = []` +
    # `wrangler deploy` ОБОИХ Worker'ов + `launchctl load` на Mac
    # (см. CLAUDE.md, «Процедура флипа»).
    #
    # (Та же строка — анти-петля: коммит last_digest.json делает
    # github-actions[bot]; GITHUB_TOKEN-пуши и так не триггерят workflow,
    # paths-фильтр смотрит только на last_digest_context.json — но держим
    # явный щит.)
    #
    # Гард по сообщению коммита (ревью Fable 16.08.2026): условие по актору
    # отсекает ТОЛЬКО крон. Без второй половины ЛЮБОЙ человеческий push,
    # задевший last_digest_context.json (ручная починка данных, merge,
    # тестовый прогон резерва в выходные), повторно разослал бы вчерашний
    # дайджест в Telegram и push ВСЕМ подписчикам — при ещё живом кроне.
    # «(Mac-парсинг)» — фиксированный хвост сообщения коммита
    # parse_and_push.sh; только такие пуши и должны собирать дайджест.
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'Mac-парсинг')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Начать технический отчёт
        run: |
          report_path="$RUNNER_TEMP/court-technical-report.json"
          rm -f -- "$report_path" "${report_path%.json}.html"
          echo "TECHNICAL_REPORT_PATH=$report_path" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Replay digest (гибрид) + доставка
        id: digest
        env:
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          # Гибрид — дефолт кода (с 03.07.2026): программный рендер
          # generate_template_digest + LLM ТОЛЬКО на пересказ мотивировок
          # актов (summarize_act_motivation, кэш data/.act_summaries.json).
          # Откат на старый полный LLM-дайджест — вернуть строку
          # `DIGEST_FULL_LLM: "1"` в этот env-блок.
          # Порог свёртки «заведено N новых исков банка»: replay обязан
          # воспроизводить крон (у спящего резерва D2 это боевой дайджест).
          BANK_INTAKE_DIGEST_FOLD: ${{ vars.BANK_INTAKE_DIGEST_FOLD || '25' }}
          # Свёртка «вступило в силу» и потолок перечня сторон (21.08.2026):
          # replay обязан воспроизводить крон, иначе тестовый дайджест
          # разойдётся с боевым.
          BANK_FORCE_DIGEST_FOLD: ${{ vars.BANK_FORCE_DIGEST_FOLD || '3' }}
          DIGEST_PARTIES_MAX_LEN: ${{ vars.DIGEST_PARTIES_MAX_LEN || '60' }}
          DIGEST_PARTIES_KEEP: ${{ vars.DIGEST_PARTIES_KEEP || '2' }}
          # Провайдер пересказов — ТОТ ЖЕ, что у облачного крона (зеркало
          # update_cases.yml; решение юриста 19.08.2026 при флипе на Mac-резерв:
          # с выключенным облачным кроном replay — боевой путь дайджеста).
          # Пересказы: фиксированный Apodex → настроенный GigaChat → Claude.
          # Откат на Claude без правки кода — Actions Variable LLM_PROVIDER=claude
          # (ANTHROPIC_API_KEY ниже оставлен именно для этого).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openrouter' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SUMMARY_MODEL: apodex/apodex-1.1-mini:free
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_SCOPE: ${{ vars.GIGACHAT_SCOPE || 'GIGACHAT_API_PERS' }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-3-Pro' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5-20251001' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Личный чат получает один технический отчёт после всех этапов.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          TELEGRAM_CHAT_ID_PERSONAL: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Web push из ЭТОГО шага не уходит: сначала коммит last_digest.json
          # и публикация на Pages, потом отдельный шаг --push-web-only ниже.
          # Иначе пуш обгоняет сайт (26.08.2026: Pages собирался ~5 минут
          # из-за очереди из трёх пушей доставочного слота, и клик по пушу
          # в 08:55 открывал ВЧЕРАШНИЙ дайджест до 09:00).
          # ⚠️ Откат — удалять ПАРОЙ: эту строку И оба шага «Дождаться
          # публикации…»/«Web push…» ниже, иначе пуш уйдёт дважды.
          DEFER_WEB_PUSH: "1"
          # Группы фаз и аннотации WARNING/ERROR в UI Actions (ghlog.py).
          LOG_GH_ANNOTATIONS: "1"
        # --push-all: рассылка всем PWA-подписчикам (как продовый крон),
        # а не только владельцу.
        run: python scripts/update_cases.py --replay-last --push-all

      - name: Commit rendered digest
        id: commit
        run: |
          echo "status=failed" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # pushed=1 — шагу «Дождаться публикации» есть чего ждать (в т.ч.
          # ветка «нет изменений»: сайт уже отдаёт актуальные байты, и
          # проверка пройдёт мгновенно). Единственный pushed=0 — ниже, когда
          # rebase не удался и наш last_digest.json на remote не попал.
          echo "pushed=1" >> "$GITHUB_OUTPUT"
          # last_digest.json — готовый дайджест для блока «📰 Дайджест» на сайте.
          if [ -f data/last_digest.json ]; then
            git add data/last_digest.json
          fi
          # Журнал последней push-рассылки — читает админка подписчиков.
          if [ -f data/last_personal_pushes.json ]; then
            git add data/last_personal_pushes.json
          fi
          # cases.json: replay пишет разбор акта (act_analysis) в карточку
          # дела — без коммита drawer в приложении оставался со старым
          # сырым текстом от Mac-прогона.
          if [ -f data/cases.json ]; then
            git add data/cases.json
          fi
          # cases_bank.json + events: replay пишет разбор акта и в карточку
          # иска банка (в cases.json этих дел нет). Под Mac-режимом это
          # ЕДИНСТВЕННЫЙ путь появления «Почему» в банк-картотеке — на машине
          # юриста ключей LLM нет, и её собственный прогон разбор не считает.
          if [ -f data/cases_bank.json ]; then
            git add data/cases_bank.json
          fi
          if [ -f data/cases_bank_events.json ]; then
            git add data/cases_bank_events.json
          fi
          # Кэш LLM-пересказов мотивировок: без коммита каждый повторный
          # replay заново оплачивает пересказ тех же актов.
          if [ -f data/.act_summaries.json ]; then
            git add data/.act_summaries.json
          fi
          if [ -f data/.act_summaries.pending.json ]; then
            git add data/.act_summaries.pending.json
          fi
          if [ -f data/.llm_provider_state.json ]; then
            git add data/.llm_provider_state.json
          fi
          for archive in data/cases_archive.json data/cases_bank_archive.json data/cases_bank_archive_events.json data/cases_archive_[0-9][0-9][0-9][0-9].json data/cases_bank_archive_[0-9][0-9][0-9][0-9].json; do
            [ ! -f "$archive" ] || git add "$archive"
          done
          if git diff --cached --quiet; then
            echo "Нет изменений — нечего коммитить"
            echo "status=confirmed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "📰 Дайджест собран (replay после Mac-парсинга)"
          # Гонка с параллельным пушем Mac: подтягиваем свежий main перед
          # своим пушем. При конфликте сохраняем прежнюю политику push,
          # а отсутствие публикации явно попадёт в технический отчёт.
          git pull --rebase origin main || {
            echo "⚠ rebase не удался — пропускаю коммит; push отправим без ожидания Pages"
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            echo "status=not_confirmed" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git push
          echo "status=confirmed" >> "$GITHUB_OUTPUT"

      # Пуш не должен обгонять сайт. Критерий готовности — не деплой-API,
      # а сам артефакт: сайт отдаёт байты НАШЕГО data/last_digest.json.
      # Потолок ~7 минут (26.08.2026 очередь Pages заняла ~5:15); по
      # истечении шлём push без подтверждения — прежнее поведение, не хуже.
      # URL выводится из репозитория, НЕ хардкодить: workflow общий для
      # эталона и форков территорий.
      - name: Дождаться публикации дайджеста на Pages
        id: pages
        if: steps.commit.outputs.pushed == '1'
        env:
          PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/last_digest.json"
        run: |
          echo "status=failed" >> "$GITHUB_OUTPUT"
          WANT=$(sha256sum data/last_digest.json | cut -d' ' -f1)
          echo "Ждём, пока ${PAGES_URL} отдаст ${WANT}"
          for i in $(seq 1 40); do
            GOT=$(curl -fsSL "${PAGES_URL}?pubcheck=$(date +%s)-${i}" | sha256sum | cut -d' ' -f1 || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "Сайт отдаёт свежий дайджест (попытка ${i})"
              echo "status=confirmed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Pages не показал свежий дайджест за ~7 минут — шлём push без подтверждения"
          echo "status=unconfirmed" >> "$GITHUB_OUTPUT"

      - name: Web push после публикации
        id: push
        env:
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Telegram — только для crash-алерта (send_crash_alert в фасаде).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          LOG_GH_ANNOTATIONS: "1"
        # Дайджест не перегенерируется: режим читает тот же контекст, что и
        # --replay-last выше, и шлёт персонализированный push (--push-all —
        # как продовый крон).
        run: python scripts/update_cases.py --push-web-only --push-all

      # Журнал last_personal_pushes.json пишется только что отправленным
      # пушем — то есть ПОСЛЕ основного коммита. Без этого докоммита админка
      # подписчиков («Последний push») читала бы вчерашнюю рассылку.
      # github-actions[bot] + paths-фильтр по last_digest_context.json —
      # петли workflow этот пуш не создаёт.
      - name: Commit журнала push-рассылки
        id: push_journal
        run: |
          [ -f data/last_personal_pushes.json ] || exit 0
          git add data/last_personal_pushes.json
          if git diff --cached --quiet; then
            echo "Журнал не изменился — нечего коммитить"
            exit 0
          fi
          git commit -m "📮 Журнал push-рассылки (после публикации Pages)"
          git pull --rebase origin main || {
            echo "⚠ rebase журнала не удался — догонит следующим прогоном"
            exit 0
          }
          git push || echo "⚠ push журнала не удался — догонит следующим прогоном"

      - name: Технический отчёт в личный Telegram
        if: always()
        env:
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_PERSONAL: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          WORKFLOW_STATUS: ${{ job.status }}
          DIGEST_STATUS: ${{ steps.digest.outcome || 'unknown' }}
          PUBLICATION_STATUS: ${{ steps.commit.outputs.status || 'skipped' }}
          PAGES_STATUS: ${{ steps.pages.outputs.status || 'skipped' }}
          PUSH_STATUS: ${{ steps.push.outcome || 'skipped' }}
        run: |
          report_python="$(command -v python || command -v python3)"
          if [ -f scripts/technical_report.py ]; then
            "$report_python" scripts/technical_report.py --send \
            --workflow-status "$WORKFLOW_STATUS" \
            --digest-step "$DIGEST_STATUS" \
            --data-publication "$PUBLICATION_STATUS" \
            --pages "$PAGES_STATUS" \
            --push-step "$PUSH_STATUS"
          else
            # Checkout мог завершиться до появления CLI. Этот запасной сигнал
            # не зависит от файлов проекта и никогда не дублирует вызов CLI.
            "$report_python" - <<'PY_FALLBACK'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('TELEGRAM_CHAT_ID_PERSONAL') or os.environ.get('TELEGRAM_CHAT_ID')
          if not token or not chat:
              print('Аварийный технический отчёт: Telegram не настроен.')
              sys.exit(1)
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          message = ('🚨 Технический отчёт не собран: после checkout недоступны файлы проекта. '
                     'Результат парсинга и доставки не подтверждён. '
                     f'Проверьте запуск: https://github.com/{repository}/actions/runs/{run_id}')
          payload = json.dumps({'chat_id': chat, 'text': message, 'disable_web_page_preview': True}).encode()
          try:
              request = Request(f'https://api.telegram.org/bot{token}/sendMessage', data=payload,
                                headers={'Content-Type': 'application/json'})
              with urlopen(request, timeout=30) as response:
                  accepted = bool(json.load(response).get('ok'))
          except Exception:
              accepted = False
          print('Аварийный технический отчёт принят Telegram.' if accepted
                else 'Telegram не подтвердил аварийный технический отчёт.')
          sys.exit(0 if accepted else 1)
          PY_FALLBACK
          fi

      - name: Сохранить технический отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/court-technical-report.json
            ${{ runner.temp }}/court-technical-report.html
          if-no-files-found: ignore
          retention-days: 7
