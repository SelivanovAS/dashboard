name: Update Court Cases

on:
  # Основной автозапуск (с 05.07.2026 возвращён в облако): суды снова пускают
  # US-IP GitHub (проверено probe_courts.yml), поэтому полный прогон снова
  # умещается в один раннер — без Mac и Cloudflare Worker. Cron в UTC:
  # 03:00 UTC = 08:00 ХМАО (UTC+5), будни. Совпадает с окном Mac-плиста-резерва.
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:  # Ручной запуск из UI (и запасной путь через Worker, если вернут)
    inputs:
      to_group:
        description: 'Отправить дайджест в корпоративную группу (TELEGRAM_CHAT_ID). Снять галку — в личный чат.'
        required: false
        type: boolean
        default: false
      smart_skip:
        description: 'Smart-skip: пропускать дела с известной будущей датой (заседание/без движения) и нерабочие дни РФ. Cron всегда true; ручной запуск — false для полного прогона.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run court monitor
        env:
          # Гибрид — дефолт кода (с 03.07.2026): программный рендер + Claude
          # только на пересказ мотивировок актов. Откат на полный
          # LLM-дайджест — вернуть строку `DIGEST_FULL_LLM: "1"`.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # По умолчанию шлём в личный чат (TELEGRAM_CHAT_ID_TEST). Cloudflare Worker
          # дёргает workflow_dispatch без inputs → default to_group=false → личный чат.
          # Чтобы продублировать в корпоративную группу — поставить галку to_group в UI.
          TELEGRAM_CHAT_ID: ${{ inputs.to_group && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_TEST }}
          # Web Push PWA-уведомления (опционально — если не заданы, пропускаются).
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Smart-skip: плановый запуск (schedule) всегда smart_skip=true —
          # парсер пропускает нерабочие дни РФ и дела с известной будущей датой
          # (как прежний Worker-крон). Ручной запуск — по галке (дефолт false).
          SKIP_NON_WORKING_DAYS: ${{ (inputs.smart_skip || github.event_name == 'schedule') && '1' || '' }}
        run: |
          if [ "${{ inputs.to_group }}" = "true" ]; then
            echo "📢 GROUP CHAT: digest will go to corporate group"
          else
            echo "📱 PERSONAL CHAT: digest will go to personal chat"
          fi
          if [ "${{ inputs.smart_skip }}" = "true" ]; then
            echo "🧠 SMART-SKIP: skip-нерабочих-дней + skip-будущих-заседаний"
          fi
          python scripts/update_cases.py --json

      - name: Commit updated data
        run: |
          git config user.name "Court Monitor Bot"
          git config user.email "bot@court-monitor.local"
          git add data/sberbank_cases.csv data/.digested_acts data/cases.json
          # Дедуп кассационных определений (аналог .digested_acts) — без
          # коммита повторный new_act по тому же определению не подавится.
          if [ -f data/.cassation_acts ]; then
            git add data/.cassation_acts
          fi
          if [ -f data/sberbank_cases_archive.csv ]; then
            git add data/sberbank_cases_archive.csv
          fi
          if [ -f data/cases_archive.json ]; then
            git add data/cases_archive.json
          fi
          # Холодные годовые архивы (cases_archive_YYYY.json) — дела старше года,
          # вынесенные из горячего архива ротацией (rotate_cold_archive). Фронт
          # их не грузит, но без коммита новые файлы теряются между прогонами.
          git add data/cases_archive_*.json 2>/dev/null || true
          # Контекст дайджеста нужен workflow `Digest Only` (--replay-last).
          # Без коммита каждый следующий запуск видит пустой checkout и падает.
          if [ -f data/last_digest_context.json ]; then
            git add data/last_digest_context.json
          fi
          # Готовый HTML дайджеста для блока «📰 Дайджест» на сайте (читает app.js).
          # Без коммита GitHub Pages обслуживает старую версию.
          if [ -f data/last_digest.json ]; then
            git add data/last_digest.json
          fi
          # Журнал последней push-рассылки — читает админка подписчиков, чтобы
          # показать «что получила каждая подписка». Без коммита файл теряется
          # в раннере GitHub Actions и не попадает на GitHub Pages → админка
          # фетчит 404 и блок «Последний push» остаётся пустым.
          if [ -f data/last_personal_pushes.json ]; then
            git add data/last_personal_pushes.json
          fi
          # Журнал здоровья парсеров (детектор молчаливой поломки): история
          # количества результатов по каждому суду. Без коммита история
          # обнуляется каждый прогон и детектор слепнет.
          if [ -f data/parse_health.json ]; then
            git add data/parse_health.json
          fi
          # Кэш LLM-пересказов мотивировок актов (гибридный дайджест).
          # Без коммита каждый прогон заново оплачивает пересказ тех же актов.
          if [ -f data/.act_summaries.json ]; then
            git add data/.act_summaries.json
          fi
          git diff --cached --quiet || git commit -m "📊 Обновление данных $(date +'%d.%m.%Y %H:%M')"
          git push

      # Падение любого шага выше — сигнал в личный Telegram (не в группу):
      # иначе упавший ночной прогон выглядит как «сегодня нет новостей».
      # curl вместо python — сработает, даже если упала установка зависимостей.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="🚨 Ночной прогон мониторинга упал (run #${{ github.run_number }}). Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null || true
