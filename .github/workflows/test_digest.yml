name: Проверка моделей пересказов без доставки
on:
  workflow_dispatch:
    inputs:
      use_saved_acts:
        description: 'Использовать сохранённые акты (только после отдельного согласия)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Только модель на сохранённых примерах
        env:
          USE_SAVED_ACTS: ${{ inputs.use_saved_acts }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python diagnostics/summary-model-20261014/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summary-model-probe
          path: ${{ runner.temp }}/summary-probe.json
          retention-days: 7
