name: Test Digest

# Объединённый тестовый прогон. Парсинга не делает — переигрывает
# последний продовый дайджест из data/last_digest_context.json через LLM
# с актуальным промптом. Telegram: личный по умолчанию, группа по галке.
# PWA push: владельцу по умолчанию, всем подписчикам по галке.
# Перезаписывает data/last_digest.json и коммитит обратно в репо.

on:
  workflow_dispatch:
    inputs:
      to_group:
        description: 'Слать в корпоративную группу Telegram. Снять галку — в личный чат.'
        required: false
        type: boolean
        default: false
      push_all:
        description: 'PWA push на ВСЕ устройства (включая коллег). Снять галку — только владельцу.'
        required: false
        type: boolean
        default: false
      polish_html:
        description: 'Включить LLM-полировщик HTML (DIGEST_POLISH=1) — косметика поверх программного шаблона. Без галки — чистый шаблон.'
        required: false
        type: boolean
        default: false
      full_llm:
        description: 'Старый Claude-вариант (DIGEST_FULL_LLM=1) — полный LLM-вызов с большим контекстом. Перебивает polish_html.'
        required: false
        type: boolean
        default: false

# Коммит обновлённого last_digest.json — нужен contents: write.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Replay last digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.to_group && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_TEST }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Управление архитектурой дайджеста для тестирования.
          # full_llm перебивает polish_html — старый Claude-вариант
          # игнорирует флаг полировщика.
          DIGEST_FULL_LLM: ${{ inputs.full_llm && '1' || '' }}
          DIGEST_POLISH: ${{ inputs.polish_html && '1' || '' }}
        run: |
          if [ "${{ inputs.to_group }}" = "true" ]; then
            echo "📢 GROUP CHAT: digest will go to corporate group"
          else
            echo "📱 PERSONAL CHAT: digest will go to personal chat"
          fi
          if [ "${{ inputs.full_llm }}" = "true" ]; then
            echo "🤖 FULL LLM: старый Claude-вариант (DIGEST_FULL_LLM=1)"
          elif [ "${{ inputs.polish_html }}" = "true" ]; then
            echo "✨ HYBRID + POLISH: программный шаблон + LLM-полировщик (DIGEST_POLISH=1)"
          else
            echo "🏗 HYBRID: программный шаблон без полировщика"
          fi
          if [ "${{ inputs.push_all }}" = "true" ]; then
            echo "📣 ALL DEVICES: PWA push to every subscriber"
            python scripts/update_cases.py --replay-last --push-all
          else
            echo "👤 OWNER ONLY: PWA push to owner devices"
            python scripts/update_cases.py --replay-last
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/last_digest.json ]; then
            git add data/last_digest.json
          fi
          # Журнал последней push-рассылки — читает админка подписчиков. Тестовые
          # прогоны тоже шлют push (владельцу/всем), и этот файл должен попадать
          # на GitHub Pages, иначе админка не покажет, что получила подписка.
          if [ -f data/last_personal_pushes.json ]; then
            git add data/last_personal_pushes.json
          fi
          # cases.json (act_analysis из replay) + кэш LLM-пересказов —
          # та же пара, что коммитит replay_on_push.yml.
          if [ -f data/cases.json ]; then
            git add data/cases.json
          fi
          if [ -f data/.act_summaries.json ]; then
            git add data/.act_summaries.json
          fi
          if git diff --cached --quiet; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git commit -m "🔁 Test Digest: переигран дайджест через LLM"
          git pull --rebase origin main || {
            echo "⚠ rebase не удался — пропускаю коммит (дайджест уже отправлен)"
            exit 0
          }
          git push
