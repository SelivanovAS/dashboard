name: 🧪 Тест дайджеста (replay)

# Объединённый тестовый прогон. Парсинга не делает — переигрывает
# последний продовый дайджест из data/last_digest_context.json (гибрид:
# программный шаблон + LLM на пересказ мотивировок; галка full_llm —
# откат на старый полный LLM-вариант). LLM-провайдер выбирается списком
# llm_provider (claude / gigachat / openrouter), модель — полем llm_model
# (пусто = дефолт провайдера; для openrouter — «модель дня» с shir-man.com).
# Telegram: личный по умолчанию, группа по галке. PWA push: владельцу
# по умолчанию, всем — по галке.
# Коммит результатов (last_digest.json, cases.json, кэш пересказов) — только
# по галке commit_results: без неё тестовый дайджест НЕ попадает на дашборд.

on:
  workflow_dispatch:
    inputs:
      to_group:
        description: 'Слать в корпоративную группу Telegram. Снять галку — в личный чат.'
        required: false
        type: boolean
        default: false
      push_all:
        description: 'PWA push на ВСЕ устройства (включая коллег). Снять галку — только владельцу.'
        required: false
        type: boolean
        default: false
      full_llm:
        description: 'Старый вариант (DIGEST_FULL_LLM=1) — полный LLM-вызов с большим контекстом вместо программного шаблона.'
        required: false
        type: boolean
        default: false
      llm_provider:
        description: 'LLM-провайдер дайджеста.'
        required: false
        type: choice
        options:
          - claude
          - gigachat
          - openrouter
        default: claude
      llm_model:
        description: 'Модель. Пусто = дефолт: claude — haiku, gigachat — GigaChat, openrouter — «модель дня» с shir-man.com (fallback openrouter/free).'
        required: false
        type: string
        default: ''
      commit_results:
        description: 'Закоммитить результаты в репо (тестовый дайджест попадёт на дашборд: last_digest.json, cases.json, кэш пересказов). Без галки — только Telegram/push.'
        required: false
        type: boolean
        default: false

# Коммит обновлённого last_digest.json — нужен contents: write.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Replay last digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.to_group && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_TEST }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Управление архитектурой дайджеста для тестирования:
          # без галки — боевой гибрид, с галкой — старый полный LLM.
          DIGEST_FULL_LLM: ${{ inputs.full_llm && '1' || '' }}
          # Выбор LLM-провайдера и модели. Общее поле llm_model уходит и в
          # GIGACHAT_MODEL, и в OPENROUTER_MODEL — читает только активный
          # провайдер, пустая строка означает дефолт (гарды в config.py).
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_SCOPE: GIGACHAT_API_PERS
          GIGACHAT_MODEL: ${{ inputs.llm_model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.llm_model }}
        run: |
          echo "🧠 PROVIDER: ${{ inputs.llm_provider }}, model: ${{ inputs.llm_model || '(дефолт / модель дня)' }}"
          if [ "${{ inputs.to_group }}" = "true" ]; then
            echo "📢 GROUP CHAT: digest will go to corporate group"
          else
            echo "📱 PERSONAL CHAT: digest will go to personal chat"
          fi
          if [ "${{ inputs.full_llm }}" = "true" ]; then
            echo "🤖 FULL LLM: старый Claude-вариант (DIGEST_FULL_LLM=1)"
          else
            echo "🏗 HYBRID: программный шаблон + LLM-пересказы актов"
          fi
          if [ "${{ inputs.push_all }}" = "true" ]; then
            echo "📣 ALL DEVICES: PWA push to every subscriber"
            python scripts/update_cases.py --replay-last --push-all
          else
            echo "👤 OWNER ONLY: PWA push to owner devices"
            python scripts/update_cases.py --replay-last
          fi

      - name: Commit refreshed data
        # Без галки commit_results результаты теста живут только в логе
        # прогона и в Telegram/push — сайт (GitHub Pages) не меняется.
        if: ${{ inputs.commit_results }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/last_digest.json ]; then
            git add data/last_digest.json
          fi
          # Журнал последней push-рассылки — читает админка подписчиков. Тестовые
          # прогоны тоже шлют push (владельцу/всем), и этот файл должен попадать
          # на GitHub Pages, иначе админка не покажет, что получила подписка.
          if [ -f data/last_personal_pushes.json ]; then
            git add data/last_personal_pushes.json
          fi
          # cases.json (act_analysis из replay) + кэш LLM-пересказов —
          # та же пара, что коммитит replay_on_push.yml.
          if [ -f data/cases.json ]; then
            git add data/cases.json
          fi
          if [ -f data/.act_summaries.json ]; then
            git add data/.act_summaries.json
          fi
          if git diff --cached --quiet; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git commit -m "🔁 Test Digest: переигран дайджест через LLM"
          git pull --rebase origin main || {
            echo "⚠ rebase не удался — пропускаю коммит (дайджест уже отправлен)"
            exit 0
          }
          git push
