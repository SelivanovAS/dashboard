name: 📮 РАЗОВО — поступления в кассацию, проглоченные багом

# ОДНОРАЗОВЫЙ workflow. С 09.07.2026 объявление «дело поступило в кассацию»
# не эмитилось у дел, чью касс. жалобу уже показывала карточка 1-й инстанции
# (заглушка блока cassation глушила условие в link_cassation_cases). С 15.07
# по 31.07 так молча приехали 9 дел. Баг исправлен 31.07.2026, но задним
# числом дайджест их не объявит — у всех девяти в блоке уже стоит case_number.
#
# Прогон: сначала с галкой dry_run (текст в лог Actions), затем без неё.
# ПОСЛЕ ДОСТАВКИ УДАЛИТЬ вместе со scripts/announce_cassation_backlog.py.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только напечатать сообщение в лог, НЕ отправлять в Telegram.'
        required: false
        type: boolean
        default: true
      to_group:
        description: 'Слать в корпоративную группу. Снять галку — в личный чат.'
        required: false
        type: boolean
        default: false

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v5

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install -r scripts/requirements.txt

      - name: Отправка сводки
        env:
          REGION: ${{ vars.REGION }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.to_group && secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_TEST }}
        run: |
          python scripts/announce_cassation_backlog.py \
            ${{ inputs.dry_run && '--dry-run' || '' }}
