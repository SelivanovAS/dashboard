name: "💤 Резерв D2: дайджест на push (усыплён)"

# Вторая половина автозапуска (вариант D2). Парсинг судов делает Mac юриста
# (ops/mac-local-run/) и пушит свежий data/last_digest_context.json. Этот
# workflow ловит такой push и собирает НАСТОЯЩИЙ дайджест: Claude доступен из
# GitHub (США), а из РФ — нет, поэтому дайджест живёт здесь, а не на Mac.
#
# Эквивалент прежнего кроного update_cases.yml, но без парсинга: переигрывает
# сохранённый контекст (--replay-last) и рассылает всем (--push-all).

on:
  push:
    branches: [main]
    paths:
      - 'data/last_digest_context.json'

# Коммит перерисованного last_digest.json — нужен contents: write.
permissions:
  contents: write

# Не наслаивать прогоны, если пуши придут кучно.
concurrency:
  group: replay-on-push
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    # ⏸ 05.07.2026: D2-резерв УСЫПЛЁН — основной автозапуск вернулся в облако
    # (update_cases.yml по крону). `if: false` глушит сборку дайджеста, даже
    # если Mac ещё раз запушит last_digest_context.json (чтобы не было второго
    # дайджеста, пока Mac-LaunchAgent не выгружен). Разбудить резерв: вернуть
    # условие `github.actor != 'github-actions[bot]'` + `launchctl load` на Mac +
    # отключить облачный крон в update_cases.yml. См. CLAUDE.md, «Процедура флипа».
    #
    # (Прежняя анти-петля: коммит last_digest.json делает github-actions[bot];
    # GITHUB_TOKEN-пуши и так не триггерят workflow, paths-фильтр смотрит только
    # на last_digest_context.json — но держали явный щит.)
    if: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Replay digest (гибрид) + доставка
        env:
          # Гибрид — дефолт кода (с 03.07.2026): программный рендер
          # generate_template_digest + Claude ТОЛЬКО на пересказ мотивировок
          # актов (summarize_act_motivation, кэш data/.act_summaries.json).
          # Откат на старый полный LLM-дайджест — вернуть строку
          # `DIGEST_FULL_LLM: "1"` в этот env-блок.
          # Порог свёртки «заведено N новых исков банка»: replay обязан
          # воспроизводить крон (у спящего резерва D2 это боевой дайджест).
          BANK_INTAKE_DIGEST_FOLD: ${{ vars.BANK_INTAKE_DIGEST_FOLD || '25' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Личный чат — как и старый крон по умолчанию (to_group=false).
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_TEST }}
          PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Группы фаз и аннотации WARNING/ERROR в UI Actions (ghlog.py).
          LOG_GH_ANNOTATIONS: "1"
        # --push-all: рассылка всем PWA-подписчикам (как продовый крон),
        # а не только владельцу.
        run: python scripts/update_cases.py --replay-last --push-all

      - name: Commit rendered digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # last_digest.json — готовый дайджест для блока «📰 Дайджест» на сайте.
          if [ -f data/last_digest.json ]; then
            git add data/last_digest.json
          fi
          # Журнал последней push-рассылки — читает админка подписчиков.
          if [ -f data/last_personal_pushes.json ]; then
            git add data/last_personal_pushes.json
          fi
          # cases.json: replay пишет разбор акта (act_analysis) в карточку
          # дела — без коммита drawer в приложении оставался со старым
          # сырым текстом от Mac-прогона.
          if [ -f data/cases.json ]; then
            git add data/cases.json
          fi
          # Кэш LLM-пересказов мотивировок: без коммита каждый повторный
          # replay заново оплачивает пересказ тех же актов.
          if [ -f data/.act_summaries.json ]; then
            git add data/.act_summaries.json
          fi
          if git diff --cached --quiet; then
            echo "Нет изменений — нечего коммитить"
            exit 0
          fi
          git commit -m "📰 Дайджест собран (replay после Mac-парсинга)"
          # Гонка с параллельным пушем Mac: подтягиваем свежий main перед
          # своим пушем. При конфликте не роняем workflow — дайджест уже
          # отправлен, act_analysis догонит следующим прогоном.
          git pull --rebase origin main || {
            echo "⚠ rebase не удался — пропускаю коммит (дайджест уже отправлен)"
            exit 0
          }
          git push
