name: Общая программа — перезагрузка изолированной VM

# Only the development branch. No production environments, credentials or jobs.
on:
  push:
    branches: [codex/program-maintenance-lease]

permissions:
  contents: read

jobs:
  reboot-systemd-255-4:
    if: github.ref == 'refs/heads/codex/program-maintenance-lease'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Подготовить одноразовую VM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ubuntu-cloudimage-keyring
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Доказать сохранение защиты через настоящий reboot
        env:
          FIXTURE_OUTPUT: ${{ runner.temp }}/program-maintenance-reboot
        run: |
          python3 scripts/tests/integration/program_maintenance_reboot.py \
            --host --output "$FIXTURE_OUTPUT"
      - name: Сохранить контрольные суммы, boot_id и события таймеров
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program-maintenance-reboot-255-4-${{ github.sha }}
          path: ${{ runner.temp }}/program-maintenance-reboot/
          if-no-files-found: error
          retention-days: 14
