name: "Проверка GigaChat и Claude — без доставки"
on:
  push:
    branches: [codex/model-selection-20261006]
    paths: [.github/workflows/model-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pipeline dependencies
        run: pip install -r scripts/requirements.txt
      - name: Retry three GigaChat transport failures with in-process OAuth cache
        env:
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_SCOPE: ${{ vars.GIGACHAT_SCOPE || 'GIGACHAT_API_PERS' }}
          GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_EFFORT: high
          BENCHMARK_PROVIDERS: gigachat
          BENCHMARK_SAMPLE_IDS: H09,H19,H24
          BENCHMARK_OUTPUT: ${{ runner.temp }}/court-model-results
        run: python model-selection/validate_reserves.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: court-model-comparison
          path: ${{ runner.temp }}/court-model-results
          retention-days: 7
