# Проба раздела исполнительных листов (этап 0 трека «Иски банка», банк — истец).
# В «Движении дела» событий об ИЛ нет ни в одном отслеживаемом деле; сведения
# об ИЛ, по словам юриста, публикуются в другом разделе карточки. Workflow
# качает с GitHub-раннера карточки нескольких давно решённых исков банка
# (кандидаты отбираются из data/cases.json) и дампит структуру страницы:
# вкладки, таблицы, ключевые слова с обезличенным контекстом. Отчёт
# коммитится в ops/writ_probe/report.txt; сырые HTML уходят только артефактом
# (персональные данные в git не попадают). НИЧЕГО не парсит в данные,
# не шлёт дайджест.
name: "🔬 Проба раздела ИЛ (иски банка)"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько карточек проверить"
        required: false
        default: "8"
  push:
    paths:
      - "scripts/probe_writ_sections.py"
      - ".github/workflows/probe_writ_section.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Не толкаться пушами с ночным прогоном/импортом.
    concurrency:
      group: writ-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Проба карточек (1 вежливый запрос на дело)
        env:
          # Ручная проба: ретраи полезны — запросов мало, повтор запуска
          # дороже (боевой дефолт FETCH_MAX_RETRIES=1).
          FETCH_MAX_RETRIES: "3"
        run: |
          mkdir -p ops/writ_probe
          python3 scripts/probe_writ_sections.py \
            --limit "${{ github.event.inputs.limit || '8' }}" \
            --html-dir ops/writ_probe/html 2>&1 \
            | tee ops/writ_probe/report.txt

      - name: Upload raw HTML (артефакт, не в git)
        uses: actions/upload-artifact@v4
        with:
          name: writ-probe-html
          path: ops/writ_probe/html/
          retention-days: 5
          if-no-files-found: ignore

      - name: Commit report
        run: |
          git config user.name "Court Monitor Bot"
          git config user.email "bot@court-monitor.local"
          git add ops/writ_probe/report.txt
          git diff --cached --quiet && exit 0
          git commit -m "🔬 Отчёт пробы раздела ИЛ ($(date -u +'%d.%m.%Y %H:%M') UTC)"
          # Ретраи на случай параллельного пуша другого workflow.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep 3
          done
          git push
