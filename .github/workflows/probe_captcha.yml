name: Изолированный тест капч — OpenRouter
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-captcha-openrouter
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: 20 общих картинок, без отправки ответов суду
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python experiments/captcha-openrouter/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-captcha-openrouter
          path: benchmark-output/
          retention-days: 7
