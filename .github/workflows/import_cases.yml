# Импорт дел капчёвого суда из дампа выдачи, который оператор сдал в админку
# Worker'а (POST /admin/import-dump → KV → workflow_dispatch сюда).
# Поток: забрать дамп с Worker'а (Bearer PUSH_SECRET, свой User-Agent — урок
# бана Python-urllib 13–16.07.2026) → scripts/import_search_dump.py → commit
# данных → POST /import-result (итог оператору в админку).
# Суд выбирается ДОМЕНОМ, а ветку импортёр выбирает сам по реестру региона:
# 1-я инстанция (карточки читаются по истцовым строкам) или АПЕЛЛЯЦИЯ
# (с 25.08.2026 — Свердловский облсуд закрыл поиск проверочным кодом; там
# карточка обязательна: номер дела 1-й инстанции живёт только в ней).
#
# ⚠ Все inputs и строки отчёта передаются через env/файлы, НЕ через ${{ }} в
# run: — имя оператора и содержимое дампа произвольны, интерполяция в shell
# была бы инъекцией.
name: "📥 Импорт дел (дамп капчёвого суда)"

on:
  workflow_dispatch:
    inputs:
      dump_key:
        description: 'KV-ключ дампа (import:dump:<uuid>) — выдаёт Worker при приёме дампа'
        required: true
        type: string
      court_domain:
        description: 'Домен суда: 1-я инст. (akademicheskiy--svd.sudrf.ru) или апелляция (oblsud--svd.sudrf.ru)'
        required: true
        type: string
      operator:
        description: 'Имя оператора (журнал импортов)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Общая группа записи в data/ с основным прогоном (update_cases.yml):
# параллельный импорт уронил бы его push non-fast-forward'ом, а rebase
# ночного прогона затёр бы импортированные дела. cancel-in-progress
# выключен — импорт ждёт очередь, не убивая прогон.
concurrency:
  group: cases-data-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # 45 мин: истцовые строки дампа теперь качают карточки (до
    # MAX_BANK_CARDS_PER_IMPORT=100 по ~3-6 с) — прежних 15 мин впритык.
    timeout-minutes: 45
    env:
      # Inputs — только через env (см. предупреждение в шапке).
      DUMP_KEY: ${{ inputs.dump_key }}
      COURT_DOMAIN: ${{ inputs.court_domain }}
      OPERATOR: ${{ inputs.operator }}
      # Трек «Иски банка»: при BANK_TRACK=0 истцовые строки дампа идут прежним
      # [SKIPPED ROLE] (зеркало add_cases.yml).
      BANK_TRACK: ${{ vars.BANK_TRACK || '1' }}
      # Операторский импорт: ретраи полезны — запросов мало, повтор запуска
      # дороже (боевой дефолт FETCH_MAX_RETRIES=1).
      FETCH_MAX_RETRIES: "3"
      # Пер-суд предохранитель под размер ДАМПА, а не боевого прогона.
      # Дефолты (порог 3, проба каждые 30 пропущенных) считаны на обход сотен
      # карточек по десяткам судов; в дампе на 25 строк «каждые 30» означает
      # «никогда» — восстановиться внутри одного импорта нельзя в принципе.
      # 16.08.2026 это стоило дампа Верх-Исетского: три отказа подряд сняли суд
      # с обхода, и 12 исков банка не запрашивались вовсе. При ТОТАЛЬНОМ блоке
      # разницы нет (они всё равно не завелись бы), но блок бывает мигающим —
      # замер с машины юриста: один запрос отбит, следующие восемь прошли.
      # Порог 5 + проба каждые 3: мигающий суд восстанавливается внутри
      # импорта, лежащий не получает все 100 бесполезных запросов.
      CARD_BREAKER_MODE: "count"
      CARD_BREAKER_THRESHOLD: "5"
      CARD_BREAKER_PROBE_EVERY: "3"
      PUSH_WORKER_URL: ${{ secrets.PUSH_WORKER_URL }}
      PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # workers.dev режет пустой/дефолтный UA некоторых клиентов (ошибка 1010,
      # инцидент живого лога 13–16.07.2026) — представляемся явно.
      UA: court-monitor-import/1.0
      IMPORT_SUMMARY_PATH: /tmp/import_summary.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: POST started (журнал импортов в админке)
        run: |
          jq -n --arg dk "$DUMP_KEY" --arg ru "$RUN_URL" \
            '{dump_key:$dk, status:"started", run_url:$ru, source:"github"}' \
          | curl -s -m 20 -A "$UA" -X POST "$PUSH_WORKER_URL/import-result" \
              -H "Authorization: Bearer $PUSH_SECRET" \
              -H "Content-Type: application/json" \
              --data @- || true

      - name: Скачать дамп с Worker'а
        run: |
          curl -f -s -m 60 -A "$UA" \
            -H "Authorization: Bearer $PUSH_SECRET" \
            "$PUSH_WORKER_URL/import-dump?key=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DUMP_KEY"]))')" \
            -o /tmp/dump.html
          SIZE=$(wc -c < /tmp/dump.html)
          echo "Дамп: $SIZE байт"
          if [ "$SIZE" -lt 512 ]; then
            echo "::error::Дамп подозрительно мал ($SIZE байт) — вероятно истёк TTL 24 ч"
            exit 1
          fi

      - name: Импорт дел из дампа
        id: import
        env:
          # Регион территории (Actions Variable форка; пусто у эталона = hmao).
          REGION: ${{ vars.REGION }}
        run: |
          python3 scripts/import_search_dump.py /tmp/dump.html \
            --court-domain "$COURT_DOMAIN" \
            --operator "$OPERATOR"

      - name: Commit cases.json
        id: commit
        run: |
          git config user.name "Court Monitor Bot"
          git config user.email "bot@court-monitor.local"
          # Список файлов НЕ ведём руками: пути спрашиваются у
          # court_monitor.config (ops/stage_data_files.sh — тот же скрипт, что
          # у прогона и у резерва на Mac). Ручной перечень здесь уже был бы
          # неполон: ветка апелляции (25.08.2026) пишет ещё и CSV, а обход
          # карточек апелляции в прогоне идёт ПО СТРОКАМ CSV — незакоммиченная
          # строка означала бы дело, которое никто больше не перечитает.
          bash ops/stage_data_files.sh
          if git diff --cached --quiet; then
            echo "Изменений нет (добавлено 0 дел) — коммит не нужен"
            exit 0
          fi
          ADDED=$(jq -r '.added // 0' "$IMPORT_SUMMARY_PATH" 2>/dev/null || echo "?")
          ADDED_BANK=$(jq -r '.added_bank // 0' "$IMPORT_SUMMARY_PATH" 2>/dev/null || echo "0")
          COURT=$(jq -r '.court // .court_domain // "?"' "$IMPORT_SUMMARY_PATH" 2>/dev/null || echo "?")
          BANK_SUFFIX=""
          [ "$ADDED_BANK" != "0" ] && BANK_SUFFIX=" · 🏦 +${ADDED_BANK} в трек"
          git commit -m "📥 Импорт: ${COURT} +${ADDED}${BANK_SUFFIX} (${OPERATOR:-без имени})"
          # Ретраи: чужой push мог проскочить между checkout и push.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep 3
          done
          git push

      - name: POST итога в журнал импортов
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          # done — только когда И импорт отработал, И коммит запушился: упавший
          # push (конфликт rebase после трёх ретраев) без этой сверки слал бы
          # оператору «+N добавлено», хотя данные никуда не уехали.
          STATUS=$([ "$IMPORT_OUTCOME" = "success" ] && [ "$COMMIT_OUTCOME" = "success" ] && echo done || echo failed)
          if [ "$IMPORT_OUTCOME" = "success" ] && [ "$COMMIT_OUTCOME" != "success" ] && [ -s "$IMPORT_SUMMARY_PATH" ]; then
            jq '.error = "дамп обработан, но коммит не запушился (конфликт с параллельной записью) — повторите импорт: уже добавленное отсеет дедуп"' \
              "$IMPORT_SUMMARY_PATH" > /tmp/import_sum_err.json \
              && mv /tmp/import_sum_err.json "$IMPORT_SUMMARY_PATH"
          fi
          if [ -s "$IMPORT_SUMMARY_PATH" ]; then
            # Пейлоад — ops/import_result_body.jq, ОДИН на облако и резерв
            # (ops/mac-local-run/import_dumps.sh). Инлайновая копия здесь
            # разъехалась бы с маковской ровно так же, как разъезжались списки
            # файлов данных, — и счётчик молча пропал бы из сводки оператора.
            BODY=$(jq -c --arg dk "$DUMP_KEY" --arg st "$STATUS" --arg ru "$RUN_URL" \
              --arg src github -f ops/import_result_body.jq "$IMPORT_SUMMARY_PATH")
          else
            BODY=$(jq -n -c --arg dk "$DUMP_KEY" --arg st "$STATUS" --arg ru "$RUN_URL" \
              '{dump_key:$dk, status:$st, run_url:$ru, source:"github",
                error:"прогон упал до разбора дампа (скачивание/зависимости) — детали в run_url"}')
          fi
          printf '%s' "$BODY" | curl -s -m 20 -A "$UA" \
            -X POST "$PUSH_WORKER_URL/import-result" \
            -H "Authorization: Bearer $PUSH_SECRET" \
            -H "Content-Type: application/json" \
            --data @- || true
