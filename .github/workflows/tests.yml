name: Tests

# Прогон тестов на каждый push. Тесты синтетические (фикстуры + чистые
# функции), сети не требуют; baseline-тесты дайджеста дополнительно
# проверяют рендер на свежем data/last_digest_context.json — поэтому
# прогоняем и на автоматических коммитах данных.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q
