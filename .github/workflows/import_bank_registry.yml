# Импорт реестра исков банка (банк — истец) в data/cases_bank.json.
# Вход — ops/bank_registry/registry.csv («court_domain;case_number»),
# коммитится в репо заранее. Импорт порционный (input limit): 2 вежливых
# HTTP-запроса на дело, ~200 дел ≈ 30-45 мин. Идемпотентен — повторный
# запуск пропустит уже добавленные ([ALREADY]). Дела заводятся с
# track="plaintiff_light" и announced:true (в дайджесте не анонсируются).
name: "🏦 Импорт реестра исков банка"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Максимум добавлений за запуск (0 — без лимита)"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Один писатель data/* за раз — сериализация с основным прогоном
    # и импортёром дампов (как в import_cases.yml).
    concurrency:
      group: cases-data-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Импорт реестра
        env:
          # Операторский импорт: ретраи полезны — повтор запуска дороже
          # (боевой дефолт FETCH_MAX_RETRIES=1).
          FETCH_MAX_RETRIES: "3"
        run: |
          python3 scripts/import_bank_registry.py \
            --input ops/bank_registry/registry.csv \
            --limit "${{ github.event.inputs.limit || '200' }}"

      - name: Commit data
        run: |
          git config user.name "Court Monitor Bot"
          git config user.email "bot@court-monitor.local"
          git add data/cases_bank.json
          git diff --cached --quiet && exit 0
          git commit -m "🏦 Импорт исков банка ($(date -u +'%d.%m.%Y %H:%M') UTC)"
          # Ретраи на случай параллельного пуша другого workflow.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep 3
          done
          git push
