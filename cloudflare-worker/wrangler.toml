name = "court-monitor-trigger"
main = "worker.js"
compatibility_date = "2024-01-01"

# ── Адреса Worker'а (27.08.2026) ────────────────────────────────────────────
# Часть операторов связи режет *.workers.dev по имени (SNI) — с их сетей не
# работали синк подписок, админка и операторская. Основной адрес — свой
# домен; workers.dev ОСТАЁТСЯ живым фолбэком (фронт перебирает адреса через
# workerFetch, список — PUSH_WORKER_FALLBACKS в region_front.js).
# workers_dev = true стоит ЯВНО: при появлении routes wrangler иначе гасит
# workers.dev-адрес молча. Зона delosud.ru живёт в этом же аккаунте CF;
# wrangler deploy сам создаёт DNS-запись и сертификат. ⚠️ У зоны выключен
# ECH (RU DPI режет ECH-хендшейки) — не включать обратно.
# Форк территории ставит свой поддомен: api-ural.delosud.ru.
workers_dev = true
routes = [
  { pattern = "api-hmao.delosud.ru", custom_domain = true }
]

[triggers]
# Отдельная очистка профилей: ежедневно 21:17 UTC / 02:17 Екатеринбург.
# scheduled() распознаёт ТОЧНО эту строку и не запускает GitHub Actions.
# Парсинг выполняет VPS; его исторический cron "30 3 * * mon-fri" выключен.
# Изменения применяются только после деплоя Worker своей территории.
crons = ["17 21 * * *"]

# ── Пер-инстансные настройки территории ─────────────────────────────────────
# Форк территории меняет ТОЛЬКО этот файл: name воркера, значения [vars],
# id KV namespace и сдвиг крона (не бить sudrf одновременно с ХМАО-инстансом).
# Пустое/отсутствующее значение → worker.js использует фолбэк ХМАО-инстанса
# (см. cfgVar), поэтому существующий деплой работает и без [vars].
[vars]
ALLOWED_ORIGIN = "https://selivanovas.github.io"
CASES_DATA_URL = "https://selivanovas.github.io/dashboard/data/cases.json"
GH_REPO = "SelivanovAS/dashboard"
# Время только ПАРСЕРНОГО cron (UTC, "Ч:ММ"); пусто = парсер Worker выключен.
# Служебный cron профилей не меняет эту переменную и плитку «Автозапуск».
# Возврат облачного парсера требует согласовать VPS, добавить его cron в
# triggers и задать CRON_UTC. Обслуживание профилей остаётся отдельным.
CRON_UTC = ""
PROFILE_CLEANUP_ENABLED = "1"
# Календарный фид (webcal): опциональные переопределения для форка территории
# с другим часовым поясом — CAL_TZID (IANA-имя), CAL_TZ_OFFSET_MIN (смещение
# в минутах) и CAL_FEED_NAME (имя календаря). Дефолты worker.js — обе текущие
# территории: Asia/Yekaterinburg / 300 / «Мои заседания» — здесь не задаём.

# Счётчик посещений дашборда (31.08.2026). "0" мгновенно выключает ЗАПИСЬ
# визитов, не трогая ни фронт, ни остальные роуты: /visit — единственный путь,
# который пишет в KV без аутентификации, а бюджет writes общий на аккаунт
# (1000/день). Применяется только после `wrangler deploy`.
VISITS_ENABLED = "1"

# Исполнитель операторских импортов (дамп выдачи, точечная пачка) — 08.09.2026,
# решение юриста. "vps": Worker только кладёт запись в KV со статусом
# "queued", а забирает её VPS по слотам court-import.timer (тот же
# import_dumps.sh, что дочитывал провалы). "github" (или переменная не задана)
# — прежний путь через workflow_dispatch import_cases.yml/add_cases.yml —
# аварийный откат: действует на НОВЫЕ записи, уже стоящие в "queued" заберёт
# очередь резерва. Пометки «лист не нужен» флага не знают (всегда GitHub).
# Форк территории ставит то же значение — VPS обслуживает обе территории.
# С 09.09.2026 в этой ветке Worker ещё пишет флаг import:pending — VPS
# опрашивает его ежедневно круглосуточно каждые 5 мин (GET /import-pending);
# слоты ниже — страховка для провалов.
IMPORT_EXECUTOR = "vps"
# Слоты VPS по местному времени территории (+05) — ДЕРЖАТЬ В СИНХРОНЕ с
# ops/vps-run/systemd/court-import.timer (страж test_mac_import_dumps.py):
# из них админка обещает оператору «сервер обработает в ЧЧ:ММ» и помечает
# запись, которую сервер не забрал. При executor=vps слоты ежедневные, включая праздники.
IMPORT_SLOTS_LOCAL = "12:00,14:00,16:00,18:00,20:00"

# KV-хранилище push-подписок PWA.
# Создать namespace: wrangler kv namespace create PUSH_SUBSCRIPTIONS
# Вставить полученный id в поле id ниже, затем wrangler deploy.
[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "2ffe67ca59ce4bfe986f80d11df2ab39"
