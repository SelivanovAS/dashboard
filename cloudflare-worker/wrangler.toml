name = "court-monitor-trigger"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
# 03:45 UTC = 06:45 МСК, пн-пт.
# ВАЖНО: используем буквенный синтаксис `mon-fri`, а не цифровой `1-5`.
# Cloudflare Cron Triggers нумерует дни 1=Sun..7=Sat (не как POSIX), и
# `1-5` эмпирически срабатывал в т.ч. в воскресенье. Буквенная нотация
# однозначна — см. https://developers.cloudflare.com/workers/configuration/cron-triggers/
crons = ["45 3 * * mon-fri"]

# KV-хранилище push-подписок PWA.
# Создать namespace: wrangler kv namespace create PUSH_SUBSCRIPTIONS
# Вставить полученный id в поле id ниже, затем wrangler deploy.
[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "2ffe67ca59ce4bfe986f80d11df2ab39"
